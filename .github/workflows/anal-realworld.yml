name: PR 27286 real-binary CPU comparison
on:
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  real-binaries:
    if: github.event.pull_request.number == 27286
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          path: candidate
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          path: baseline
          ref: 766503ab572a9601c07ef9f998ebf31eb72fb6f7
      - uses: actions/checkout@v4
        with:
          repository: radareorg/radare2-testbins
          path: fixtures
      - name: Build, test and compare actual programs
        run: python3 candidate/test/bench/anal-realworld-ci.py "$GITHUB_WORKSPACE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr27286-real-binary-results
          path: results/
          retention-days: 7
