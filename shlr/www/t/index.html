<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>r2 tiles</title>
<link rel="stylesheet" href="stylesheet.css">
<script src="app.js" defer></script>
</head>
<body>
<div id="bar"><span id="tags"></span><span id="lay" role="button" tabindex="0" title="Cycle layout"></span><span id="seek"></span><span id="title"></span><button id="openfilebutton" type="button" title="Replace the current session with another file (Shift+O)">Open file</button><button id="analyzefunction" type="button" title="Analyze function at the focused address">Analyze function</button><button id="unanalyzefunction" type="button" title="Remove function analysis at the focused address">Unanalyze function</button><button id="commentbutton" type="button" title="Edit or delete comment at the focused address">Comment</button><button id="projectsbutton" type="button">Projects</button><button id="notesbutton" type="button">Notes</button><button id="packagesbutton" type="button">r2pm</button><button id="newpane" type="button" title="Open a frame with any r2 command (o or Alt+P)">+ New frame</button><button id="hint" type="button" title="Help (? or F1)" aria-label="Help" aria-controls="help">?</button></div>
<div id="wm"></div>
<div id="menu" hidden><input id="mi" spellcheck="false" autocomplete="off"><div id="menuhint" hidden></div><div id="ml"></div></div>
<div id="help" role="dialog" aria-label="Help and keyboard shortcuts" tabindex="-1" hidden><button id="helpclose" type="button">Close · Esc</button><pre id="helptext"></pre></div>
<section id="manager" class="dialog" role="dialog" aria-modal="true" aria-labelledby="managertitle" hidden><header><strong id="managertitle"></strong><button id="managerclose" type="button">Close · Esc</button></header><div id="managerbody"></div><p id="managerstatus" role="status"></p></section>
<section id="notes" class="dialog" role="dialog" aria-modal="true" aria-labelledby="notestitle" hidden><header><strong id="notestitle">Project notes</strong><span id="noteslabel"></span><button id="notesclose" type="button">Close · Esc</button></header><textarea id="notestext" aria-label="Project notes" spellcheck="false" placeholder="Research notes, findings, addresses, TODOs…"></textarea><footer><button id="notessave" type="button">Save notes and project</button><span id="notesstatus" role="status"></span></footer></section>
<div id="toast"></div>
<style id="hl"></style>
</body>
</html>
