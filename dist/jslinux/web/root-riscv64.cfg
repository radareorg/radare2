/* VM configuration file */
{
    version: 1,
    machine: "riscv64",
    memory_size: 128,
    bios: "bbl64.bin",
    kernel: "kernel-riscv64.bin",
    cmdline: "console=hvc0 root=/dev/vda rw",
    drive0: { file: "root-r2/blk.txt" },
    /* empty in-memory 9p fs: browser uploads land in its /tmp; the guest
       mounts it at /mnt (see guest/profile) */
    fs0: { file: "netfs", tag: "r2fs" },
    eth0: { driver: "user" },
}
