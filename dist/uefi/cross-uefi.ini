[binaries]
c = 'clang'
ar = 'llvm-ar'
strip = 'llvm-strip'
pkgconfig = 'pkg-config'

[properties]
# -nostdlibinc keeps the compiler builtin headers (stddef.h, stdint.h, ...)
# but drops the system libc ones, which are provided by dist/uefi/include
c_args = ['-DR2_UEFI=1', '-D__thread=', '-ffreestanding', '-fno-stack-protector', '-fshort-wchar', '-mno-red-zone', '-fPIC', '-nostdlibinc', '-isystem@DIRNAME@/include', '-I/usr/include/efi', '-I/usr/include/efi/x86_64']
c_link_args = ['-fuse-ld=lld', '-nostdlib', '-Wl,--unresolved-symbols=ignore-all']

[built-in options]
default_library = 'static'

[host_machine]
system = 'uefi'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'
