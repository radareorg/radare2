[binaries]
c = 'clang'
ar = 'llvm-ar'
strip = 'llvm-strip'
pkgconfig = 'pkg-config'

[properties]
# -nostdlibinc keeps the compiler builtin headers (stddef.h, stdint.h, ...)
# and the libc headers come from musl, which works freestanding; the
# implementations live in libr/util/uefi.c on top of the boot services
c_args = ['-DR2_UEFI=1', '-D__thread=', '-D_GNU_SOURCE', '-ffreestanding', '-fno-stack-protector', '-mno-red-zone', '-fPIC', '-nostdlibinc', '-isystem/usr/include/x86_64-linux-musl', '-I/usr/include/efi', '-I/usr/include/efi/x86_64']
c_link_args = ['-fuse-ld=lld', '-nostdlib', '-Wl,--unresolved-symbols=ignore-all']

[built-in options]
default_library = 'static'

[host_machine]
system = 'uefi'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'
