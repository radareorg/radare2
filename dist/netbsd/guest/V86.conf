# Kernel config for running NetBSD inside v86 (the browser wasm PC emulator).
#
# GENERIC crashes early under v86 with a fatal page fault at eip 0 in the
# idle lwp.  Reason: SeaBIOS (the bios v86 runs) publishes an MP floating
# pointer, so mainbus takes the MPBIOS path; under v86 that enumeration
# yields no CPU flagged as the bootstrap processor, so cpu_attach never sees
# CPU_ROLE_BP/SP and x86_cpu_idle_init() is never called.  x86_cpu_idle stays
# NULL and the first cpu_idle() call jumps to address 0.
#
# Dropping MPBIOS makes mainbus use its "no MP tables" fallback, which
# attaches cpu0 as CPU_ROLE_SP and initialises the idle handler.  v86 is
# uniprocessor and its interrupt routing is the plain 8259 PIC anyway, so
# nothing of value is lost.
include "arch/i386/conf/GENERIC"

no options 	MPBIOS

# v86 emulates a legacy VGA and exposes no PCI devices at all, but GENERIC
# only probes vga at pci (vga@isa is commented out there, see PR#49290).
# Without this nothing attaches a wsdisplay, so /dev/console cannot be
# opened and init panics in cnopen as soon as it starts.
vga0		at isa?

# v86 fakes a SoundBlaster (whose opl child then fails to configure) and
# answers the VMware backdoor port just enough for vmt to try and fail.
# Both only produce the "N errors while detecting hardware" complaint at the
# end of autoconf; there is no audio in the browser page anyway.
no sb0
no vmt0
